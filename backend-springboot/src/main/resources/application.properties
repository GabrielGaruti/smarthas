# ============================================================
# Smart HAS API - configuracao principal
# ============================================================
spring.application.name=smarthas-api
server.port=8080

# ---------- Banco de dados H2 (arquivo local, zero instalacao) ----------
# O arquivo do banco fica em ./data/smarthas.mv.db
spring.datasource.url=jdbc:h2:file:./data/smarthas;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Console web do H2 (visualizar o banco em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ---------- JWT ----------
# Chave secreta (>= 256 bits). Em producao, use variavel de ambiente SMARTHAS_JWT_SECRET.
smarthas.jwt.secret=${SMARTHAS_JWT_SECRET:troque-esta-chave-super-secreta-do-smarthas-com-256-bits-minimo}
# Validade do token em milissegundos (7 dias)
smarthas.jwt.expiration=604800000

# ---------- Swagger / OpenAPI ----------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=false
