<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Smart HAS - Visao Geral</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #f4f6fb; color: #1f2937; padding: 32px; }
        .container { max-width: 960px; margin: 0 auto; }
        h1 { color: #b91c1c; font-size: 28px; }
        .subtitle { color: #6b7280; margin-bottom: 24px; }
        .cards { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 32px; }
        .card { flex: 1; min-width: 200px; background: #fff; border-radius: 12px; padding: 24px;
                box-shadow: 0 2px 8px rgba(0,0,0,.06); border-left: 4px solid #b91c1c; }
        .card .num { font-size: 40px; font-weight: 700; color: #b91c1c; }
        .card .lbl { color: #6b7280; margin-top: 4px; }
        table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden;
                box-shadow: 0 2px 8px rgba(0,0,0,.06); }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #eef1f6; font-size: 14px; }
        th { background: #b91c1c; color: #fff; }
        .badge { padding: 4px 10px; border-radius: 999px; color: #fff; font-size: 12px; font-weight: 600; }
        .links { margin-top: 24px; }
        .links a { color: #b91c1c; margin-right: 16px; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
<div class="container">
    <h1>Smart HAS &mdash; Painel de Visao Geral</h1>
    <p class="subtitle">Pagina renderizada no servidor com Spring MVC + Thymeleaf.</p>

    <div class="cards">
        <div class="card"><div class="num" th:text="${userCount}">0</div><div class="lbl">Usuarios</div></div>
        <div class="card"><div class="num" th:text="${measurementCount}">0</div><div class="lbl">Medicoes</div></div>
        <div class="card"><div class="num" th:text="${unitCount}">0</div><div class="lbl">Unidades de saude</div></div>
    </div>

    <h2 style="margin-bottom:12px; font-size:20px;">Medicoes recentes</h2>
    <table>
        <thead>
        <tr><th>Paciente</th><th>Pressao</th><th>Data</th><th>Hora</th><th>Classificacao</th></tr>
        </thead>
        <tbody>
        <tr th:each="m : ${recent}">
            <td th:text="${m.user.fullName}">-</td>
            <td th:text="${m.systolic} + '/' + ${m.diastolic} + ' mmHg'">-</td>
            <td th:text="${m.date}">-</td>
            <td th:text="${m.time}">-</td>
            <td>
                <span class="badge"
                      th:text="${m.classification.label}"
                      th:style="'background:' + ${m.classification.colorHex}">-</span>
            </td>
        </tr>
        <tr th:if="${recent.isEmpty()}"><td colspan="5">Nenhuma medicao registrada.</td></tr>
        </tbody>
    </table>

    <div class="links">
        <a th:href="@{/swagger-ui.html}">Documentacao da API (Swagger)</a>
        <a th:href="@{/h2-console}">Console do banco (H2)</a>
        <a th:href="@{/health}">Healthcheck</a>
    </div>
</div>
</body>
</html>
