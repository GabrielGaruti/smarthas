# ============================================================
# Perfil "oracle" - Fase 6
# Ativar: mvn spring-boot:run -Dspring-boot.run.profiles=oracle
# Credenciais via variaveis de ambiente (nunca versionar a senha):
#   ORACLE_URL       (padrao: servidor Oracle da FIAP)
#   ORACLE_USER      (ex.: rm554866)
#   ORACLE_PASSWORD
# Antes de subir, execute os scripts de database/oracle (01 a 04).
# ============================================================
spring.datasource.url=${ORACLE_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
spring.datasource.username=${ORACLE_USER:rm554866}
spring.datasource.password=${ORACLE_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=5

# O schema e criado pelos scripts SQL (governanca do DDL no banco); o Hibernate nao altera tabelas
spring.jpa.hibernate.ddl-auto=none
spring.h2.console.enabled=false

smarthas.rules.engine=ORACLE_PLSQL
