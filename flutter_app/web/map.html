<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #map { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>
  <script>
    function initMap() {
      const center = { lat: -23.5505, lng: -46.6333 };

      const map = new google.maps.Map(document.getElementById('map'), {
        zoom: 13,
        center: center,
        mapTypeControl: false,
        streetViewControl: false,
        fullscreenControl: false,
      });

      const locations = [
        {
          position: center,
          title: 'Sua localização',
          snippet: 'Você está aqui',
          color: 'blue',
          hue: 210,
        },
        {
          position: { lat: -23.5558, lng: -46.6396 },
          title: 'Hospital das Clínicas',
          snippet: 'Cardiologia disponível',
          color: 'red',
          hue: 0,
        },
        {
          position: { lat: -23.5489, lng: -46.6388 },
          title: 'Sensor SmartHAS #001',
          snippet: 'Dispositivo IoT ativo',
          color: 'green',
          hue: 120,
        },
        {
          position: { lat: -23.5470, lng: -46.6420 },
          title: 'Dispositivo IoT #002',
          snippet: 'Monitor de pressão wearable',
          color: 'orange',
          hue: 30,
        },
      ];

      const infoWindow = new google.maps.InfoWindow();

      locations.forEach(function(loc) {
        const marker = new google.maps.Marker({
          position: loc.position,
          map: map,
          title: loc.title,
          icon: {
            path: google.maps.SymbolPath.CIRCLE,
            fillColor: loc.color,
            fillOpacity: 1,
            strokeColor: 'white',
            strokeWeight: 2,
            scale: loc.color === 'blue' ? 12 : 10,
          },
        });

        marker.addListener('click', function() {
          infoWindow.setContent(
            '<div style="font-family:sans-serif;padding:4px">' +
            '<strong>' + loc.title + '</strong><br>' +
            '<span style="color:#666;font-size:13px">' + loc.snippet + '</span>' +
            '</div>'
          );
          infoWindow.open(map, marker);
        });
      });
    }
  </script>
  <script
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCvs2-AHs-S9jG7_9Qf1RcHLEZr41KLYq0&callback=initMap"
    async defer>
  </script>
</body>
</html>
