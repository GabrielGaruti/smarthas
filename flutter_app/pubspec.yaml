name: smarthas_flutter
description: Smart HAS - Monitoramento de Hipertensão Arterial (Flutter)
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # HTTP / Web Services
  http: ^1.2.0

  # Local storage
  shared_preferences: ^2.2.2

  # Charts
  fl_chart: ^0.69.0

  # Utilities
  intl: ^0.19.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
